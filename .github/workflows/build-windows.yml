name: Test & Build Windows Installer

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    tags:
      - "v*"

env:
  NODE_VERSION: "24"
  PNPM_VERSION: "12"

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/gui/src-tauri -> target

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Unit tests (core + GUI + Rust)
        run: pnpm test:unit

      - name: Integration tests
        run: pnpm test:integration

      - name: Install Playwright Chromium
        run: pnpm --filter @listening-resume/gui exec playwright install chromium

      - name: E2E tests (CLI + Playwright, hermetic fake backend)
        run: pnpm test:e2e

  build-windows:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/gui/src-tauri -> target

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # core → vite → server bundle → bundled node/ffmpeg → wasapi-capture → smoke test → tauri bundle
      - name: Build installer
        run: pnpm --filter @listening-resume/gui build:windows

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            apps/gui/src-tauri/target/release/bundle/nsis/*.exe
            apps/gui/src-tauri/target/release/bundle/msi/*.msi
