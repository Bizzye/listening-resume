name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

env:
  NODE_VERSION: "22"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/gui/src-tauri -> target

      - name: Install dependencies
        run: pnpm install

      - name: Build core package
        run: pnpm --filter core build

      - name: Build server bundle
        run: pnpm --filter gui build:server

      - name: Download bundled Node.js and FFmpeg
        shell: pwsh
        run: |
          cd apps/gui/src-tauri/scripts
          .\download-deps-win.ps1

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/gui

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            apps/gui/src-tauri/target/release/bundle/nsis/*.exe
            apps/gui/src-tauri/target/release/bundle/msi/*.msi
